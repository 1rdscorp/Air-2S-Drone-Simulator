name: Deploy to GitHub Pages

# Publishes the simulator so every merged step has a link to try.
#
# Two jobs can publish to the site:
#   - this workflow, which publishes the built simulator, and
#   - GitHub's own "pages build and deployment" job, which publishes the repository's
#     README. It runs on every push to main while the repository setting
#     Settings -> Pages -> Source is "Deploy from a branch".
# Whichever finishes last is what visitors see. So this workflow runs a second time
# whenever GitHub's job has finished, which makes the simulator the last thing published.
#
# With Source set to "GitHub Actions", GitHub's job does not exist and the push trigger
# alone does the work.
on:
  push:
    branches: [main]
  workflow_run:
    # GitHub has used both spellings for its job; a name that does not exist is ignored.
    workflows: ['pages build and deployment', 'pages-build-deployment']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # After GitHub's job, publish only if that job ran for main.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: sim
    steps:
      # For every trigger this is the newest commit on main.
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: sim/.nvmrc
          cache: npm
          cache-dependency-path: sim/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # The small probe app of the controller check (Step 04) is offered next to the
      # simulator, as rc-probe.apk, so it can be downloaded in the controller's own browser.
      # It contains no DJI SDK and no key. If it cannot be built, the simulator is
      # published without it.
      - uses: actions/setup-java@v4
        continue-on-error: true
        with:
          distribution: temurin
          java-version: 21

      - name: Build the RC Probe app
        continue-on-error: true
        working-directory: rc-probe
        run: |
          ./gradlew assemblePlainDebug
          cp app/build/outputs/apk/plain/debug/app-plain-debug.apk ../sim/dist/rc-probe.apk

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: sim/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
