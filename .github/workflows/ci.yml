name: CI

on:
  push:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, type-check, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: sim
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: sim/.nvmrc
          cache: npm
          cache-dependency-path: sim/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint and formatting
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Install test browser
        run: npx playwright install --with-deps chromium

      - name: Build and smoke test
        run: npm run e2e

      - name: Keep the test report when something failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            sim/playwright-report
            sim/test-results
          retention-days: 7
