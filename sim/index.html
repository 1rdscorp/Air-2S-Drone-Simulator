<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>Air 2S Drone Simulator</title>
  </head>
  <body>
    <canvas id="view" aria-label="3D view"></canvas>
    <div id="hud" aria-label="Flight display"></div>
    <pre id="debug-overlay" hidden></pre>
    <p id="flight-status" role="status"></p>
    <div id="corner-labels">
      <p id="camera-label"></p>
      <p id="sound-label"></p>
      <p id="stick-label"></p>
      <p id="status-badge" role="status" hidden></p>
    </div>
    <section id="joystick-setup" hidden></section>
    <section id="stick-monitor" aria-label="Stick monitor" hidden></section>
    <p id="build-label"></p>
    <p id="message" role="alert" hidden></p>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
